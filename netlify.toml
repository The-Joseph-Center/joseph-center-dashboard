[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# `npm run dev` runs `netlify dev`, so its framework autodetect would otherwise
# recurse into this same script. Point it explicitly at the raw Vite server.
[functions."reconcile-staff"]
  # 07:15 UTC daily. Offboarding does not need to be instant — Okta app
  # assignment already revokes dashboard access the moment someone is
  # deactivated; this only governs how quickly their card leaves the website.
  #
  # The run stays daily; the email does not. The standing picture goes out on
  # Mondays, and anything that changed the site or blocked a write still emails
  # the same day. Dropping the run to weekly would leave a departed person's
  # photo up for up to seven days, which is the thing this exists to prevent.
  schedule = "15 7 * * *"

[functions."form-digest"]
  # Fridays at 15:00 UTC — mid-morning in Grand Junction, so the week's
  # sign-ups land while there is still a working day to act on them.
  schedule = "0 15 * * 5"

[functions."lighthouse-check"]
  # From the 2nd, 14:00 UTC, daily until the month has a test. Google's test
  # does fail occasionally, and a month's score cannot be taken afterwards.
  schedule = "0 14 2-28 * *"

[functions."monthly-report"]
  # From the 3rd, after analytics has settled the previous month's last days.
  # Exits straight away once the month is written.
  schedule = "0 14 3-28 * *"

[dev]
  command = "npm run dev:vite"
  targetPort = 5173
  port = 8888
  framework = "#custom"
  autoLaunch = false
